<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weatherly</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>

  <!-- Google Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="top-bar">
      <h2>🌤 Weatherly</h2>
      <button id="themeToggle" class="icon-btn">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
    </header>

    <!-- SEARCH -->
    <div class="search-area">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button id="searchBtn">Search</button>
      <button id="locationBtn" class="outline">📍 Current Location</button>
    </div>

    <!-- ANIMATION MESSAGE -->
    <div id="tipBox" class="tip hidden"></div>

    <!-- WEATHER -->
    <section id="weatherBox" class="weather hidden">
      <h1 id="cityName"></h1>
      <h2 id="temp"></h2>
      <p id="condition"></p>

      <div class="details">
        <div>💧 Humidity<br><strong id="humidity"></strong></div>
        <div>🌬 Wind<br><strong id="wind"></strong></div>
      </div>
    </section>

    <!-- FORECAST -->
    <section id="forecast" class="forecast hidden"></section>

    <p id="error" class="error"></p>

  </div>
</body>
</html>
